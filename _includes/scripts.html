<script src="{{ '/assets/js/main.min.js' | relative_url }}"></script>
<script>
  (function () {
    var nav = document.getElementById('site-nav');
    var button = nav.querySelector('button');
    var menu = document.getElementById('more-sections');
    button.addEventListener('click', function () {
      button.setAttribute('aria-expanded', String(!menu.classList.contains('hidden')));
    });
    function handleSectionLink(event) {
      var anchor = event.target.closest('a[href*="#"]');
      if (!anchor || anchor.pathname !== location.pathname) return;
      var target = document.getElementById(decodeURIComponent(anchor.hash.slice(1)));
      if (!target) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      history.pushState(null, '', anchor.pathname + anchor.hash);
      setCurrent(target.id);
      target.scrollIntoView({
        behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',
        block: 'start'
      });
      menu.classList.add('hidden');
      button.classList.remove('close');
      button.setAttribute('aria-expanded', 'false');
    }
    nav.addEventListener('click', handleSectionLink, true);
    var hero = document.querySelector('.hero');
    if (hero) hero.addEventListener('click', handleSectionLink, true);
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
        button.classList.remove('close');
        button.setAttribute('aria-expanded', 'false');
        button.focus();
      }
    });

    function setCurrent(id) {
      nav.querySelectorAll('a[href*="#"]').forEach(function (link) {
        if (link.hash === '#' + id) {
          link.setAttribute('aria-current', 'location');
        } else {
          link.removeAttribute('aria-current');
        }
      });
    }

    if ('IntersectionObserver' in window) {
      var sections = document.querySelectorAll('#about-me, .page__content h2[id]');
      var sectionObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) setCurrent(entry.target.id);
        });
      }, { rootMargin: '-95px 0px -65% 0px' });
      sections.forEach(function (section) { sectionObserver.observe(section); });

      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var revealObserver = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              revealObserver.unobserve(entry.target);
            }
          });
        }, { threshold: 0.08, rootMargin: '0px 0px -30px 0px' });
        document.querySelectorAll('.page__content > h2, .page__content > h2 + ul, .page__content > #about + p, .paper-box').forEach(function (item) {
          item.classList.add('reveal');
          revealObserver.observe(item);
        });
      }
    }
  }());
</script>
